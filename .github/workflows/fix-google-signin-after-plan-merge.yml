name: Fix Google sign-in after reading merge

on:
  push:
    branches:
      - fix/google-sign-in-after-reading-merge
    paths:
      - ".github/workflows/fix-google-signin-after-plan-merge.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Repair initialization and Google sign-in
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("bibleandconflictoftheages/app.js")
          app = app_path.read_text()

          old_validation = '''      if (plan.planId !== CONFIG.planId || !Array.isArray(plan.readings) || plan.readings.length !== 265) throw new Error("Reading plan validation failed.");'''
          new_validation = '''      const readingsAreValid = Array.isArray(plan.readings) && plan.readings.length > 0;
              const declaredReadingCount = Array.isArray(plan.books)
                ? plan.books.reduce((total, book) => total + (Number(book.readingCount) || 0), 0)
                : readingsAreValid ? plan.readings.length : 0;
              const readingSequenceIsValid = readingsAreValid
                && declaredReadingCount === plan.readings.length
                && new Set(plan.readings.map((reading) => reading.id)).size === plan.readings.length
                && plan.readings.every((reading, index) => reading?.id && reading.day === index + 1);
              if (plan.planId !== CONFIG.planId || !readingSequenceIsValid) throw new Error("Reading plan validation failed.");'''
          if old_validation not in app:
              raise SystemExit("Expected hard-coded reading-count validation was not found")
          app = app.replace(old_validation, new_validation, 1)

          old_signin = '''  async function signInGoogle() {
              authError.textContent = "";
              signInButton.disabled = true;
              signInButton.lastChild.textContent = " Connecting…";
              const redirectTo = `${location.origin}${location.pathname}`;
              const { error } = await db.auth.signInWithOAuth({ provider: "google", options: { redirectTo } });
              if (error) {
                authError.textContent = error.message;
                signInButton.disabled = false;
                signInButton.lastChild.textContent = " Continue with Google";
              }
            }'''
          new_signin = '''  async function signInGoogle() {
              authError.textContent = "";
              signInButton.disabled = true;
              signInButton.lastChild.textContent = " Connecting…";
              try {
                if (!db?.auth) throw new Error("The secure account service is still loading. Please refresh and try again.");
                const redirectTo = CONFIG.siteUrl || `${location.origin}${location.pathname}`;
                const { error } = await db.auth.signInWithOAuth({
                  provider: "google",
                  options: { redirectTo },
                });
                if (error) throw error;
              } catch (error) {
                console.error("Google sign-in", error);
                authError.textContent = error?.message || "Google sign-in could not be started. Please refresh and try again.";
                signInButton.disabled = false;
                signInButton.lastChild.textContent = " Continue with Google";
              }
            }'''
          if old_signin not in app:
              raise SystemExit("Expected Google sign-in function was not found")
          app = app.replace(old_signin, new_signin, 1)
          app_path.write_text(app)

          index_path = Path("bibleandconflictoftheages/index.html")
          index = index_path.read_text()
          replacements = {
              '<strong id="hero-reading-count">265</strong> readings': '<strong id="hero-reading-count">264</strong> readings',
              'principle groups saved and synced across your devices': 'principle folders saved and synced across your devices',
              'app.js?v=20260830-5': 'app.js?v=20260903-1',
          }
          for old, new in replacements.items():
              if old not in index:
                  raise SystemExit(f"Expected index text was not found: {old}")
              index = index.replace(old, new, 1)
          index_path.write_text(index)

          test_path = Path("scripts/test-conflict-plan.mjs")
          test = test_path.read_text()
          replacements = {
              'assert.equal(websitePlan.readings.length, 265);': 'assert.equal(websitePlan.readings.length, 264);',
              '{ PP: 67, PK: 60, DA: 82, AA: 44, GC: 12 }': '{ PP: 66, PK: 60, DA: 82, AA: 44, GC: 12 }',
              '  assert.equal(reading.id, `coa-${String(index + 1).padStart(3, "0")}`);': '  assert.match(reading.id, /^coa-\\d{3}$/);',
              'Conflict journey validation passed: 265 readings, 1696 individually trackable chapters': 'Conflict journey validation passed: 264 readings, 1696 individually trackable chapters',
          }
          for old, new in replacements.items():
              if old not in test:
                  raise SystemExit(f"Expected conflict-plan test text was not found: {old}")
              test = test.replace(old, new, 1)
          marker = 'assert.equal(websitePlan.reviewQueue.length, 0);'
          unique_check = 'assert.equal(new Set(websitePlan.readings.map((reading) => reading.id)).size, websitePlan.readings.length);'
          if unique_check not in test:
              test = test.replace(marker, f'{marker}\n{unique_check}', 1)
          test_path.write_text(test)

          combined_path = Path("scripts/validate-combined-first-reading.mjs")
          combined = combined_path.read_text()
          marker = 'assert.match(appSource, /legacyProgressIndex/);'
          additions = '''assert.doesNotMatch(appSource, /plan\\.readings\\.length !== 265/);
          assert.match(appSource, /declaredReadingCount/);
          assert.match(appSource, /CONFIG\\.siteUrl \\|\\|/);'''
          if 'declaredReadingCount' not in combined:
              if marker not in combined:
                  raise SystemExit("Expected combined-reading validation marker was not found")
              combined = combined.replace(marker, f'{marker}\n{additions}', 1)
          combined_path.write_text(combined)
          PY

      - name: Validate the repair
        run: |
          node --check bibleandconflictoftheages/app.js
          node scripts/test-conflict-plan.mjs
          node scripts/validate-combined-first-reading.mjs

      - name: Commit the repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-google-signin-after-plan-merge.yml
          git add bibleandconflictoftheages/app.js bibleandconflictoftheages/index.html scripts/test-conflict-plan.mjs scripts/validate-combined-first-reading.mjs
          git commit -m "Restore Google sign-in after reading merge"
          git push origin "HEAD:${{ github.ref_name }}"
