name: Apply Combined Opening Reading

on:
  push:
    branches:
      - feature/combine-first-two-readings
    paths:
      - ".github/workflows/apply-combined-opening-reading.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply and validate the reading-plan migration
        run: |
          python scripts/apply-combined-opening-reading.py
          node --check scripts/import-conflict-reading-plans.mjs
          node --check bibleandconflictoftheages/app.js
          node scripts/validate-combined-first-reading.mjs
      - name: Commit the combined opening assignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibleandconflictoftheages/data/readings.json bibleandconflictoftheages/app.js scripts/import-conflict-reading-plans.mjs
          git commit -m "Combine the first two Conflict readings"
          git push origin "HEAD:${{ github.ref_name }}"
