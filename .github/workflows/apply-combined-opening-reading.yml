name: Apply Combined Opening Reading

on:
  push:
    branches:
      - feature/combine-first-two-readings
    paths:
      - ".github/workflows/apply-combined-opening-reading.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Combine the first two readings without remapping saved IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          plan_path = Path('bibleandconflictoftheages/data/readings.json')
          plan = json.loads(plan_path.read_text())
          readings = plan['readings']

          if any(item.get('id') == 'coa-002' for item in readings):
              first, second = readings[0], readings[1]
              assert first['id'] == 'coa-001' and first['sourceKey'] == 'PP:1'
              assert second['id'] == 'coa-002' and second['sourceKey'] == 'PP:2'

              bible_tasks = []
              for index, task in enumerate(second['bibleTasks'], start=1):
                  bible_tasks.append({**task, 'legacyProgressIndex': index})

              commentary_tasks = [
                  {**first['commentaryTasks'][0], 'legacyProgressIndex': 0},
                  {**second['commentaryTasks'][0], 'legacyProgressIndex': 3},
              ]

              combined = {
                  **first,
                  'day': 1,
                  'sourceBlock': 1,
                  'sourceKey': 'PP:1+2',
                  'sourceEntry': 'Gen 1; 2\nCh 1—Why was Sin Permitted? PP 33-43\nCh 2—The Creation PP 44-51',
                  'originalSourceEntry': f"{first['sourceEntry']}\n\n{second['sourceEntry']}",
                  'correctionApplied': True,
                  'heading': '',
                  'title': 'Why was Sin Permitted? · The Creation',
                  'bibleReference': 'Gen 1; 2',
                  'bibleQuery': 'Gen 1; 2',
                  'bibleUrl': second['bibleUrl'],
                  'bibleTasks': bible_tasks,
                  'commentaryCitation': 'Ch 1—Why was Sin Permitted? PP 33-43 · Ch 2—The Creation PP 44-51',
                  'commentaryPageStart': 33,
                  'commentaryPageEnd': 51,
                  'commentaryUrl': first['commentaryUrl'],
                  'commentaryTasks': commentary_tasks,
                  'reviewNote': None,
              }
              readings = [combined, *readings[2:]]
          else:
              assert readings[0]['id'] == 'coa-001' and readings[0]['sourceKey'] == 'PP:1+2'

          for day, reading in enumerate(readings, start=1):
              reading['day'] = day

          plan['readings'] = readings
          plan['readingAliases'] = {**plan.get('readingAliases', {}), 'coa-002': 'coa-001'}
          for book in plan['books']:
              book['readingCount'] = sum(1 for reading in readings if reading['code'] == book['code'])
          plan['reviewQueue'] = [
              {
                  'id': reading['id'],
                  'day': reading['day'],
                  'sourceKey': reading['sourceKey'],
                  'sourceEntry': reading['sourceEntry'],
                  'reviewNote': reading['reviewNote'],
              }
              for reading in readings if reading.get('reviewNote')
          ]
          plan['generatedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          plan_path.write_text(json.dumps(plan, indent=2, ensure_ascii=False) + '\n')

          importer_path = Path('scripts/import-conflict-reading-plans.mjs')
          importer = importer_path.read_text()
          old_importer = '''const rawReadings = [
            ...parsePP(sourceTexts.PP),
            ...parsePK(sourceTexts.PK),
            ...parseDA(sourceTexts.DA),
            ...parseAA(sourceTexts.AA),
            ...parseGC(sourceTexts.GC),
          ];

          const readings = rawReadings.map((reading, index) => ({
            id: `coa-${String(index + 1).padStart(3, "0")}`,
            day: index + 1,
            ...reading,
          }));'''
          new_importer = '''const parsedReadings = [
            ...parsePP(sourceTexts.PP),
            ...parsePK(sourceTexts.PK),
            ...parseDA(sourceTexts.DA),
            ...parseAA(sourceTexts.AA),
            ...parseGC(sourceTexts.GC),
          ].map((reading, index) => ({
            id: `coa-${String(index + 1).padStart(3, "0")}`,
            ...reading,
          }));

          function combineOpeningPpReadings(items) {
            const [first, second, ...remaining] = items;
            if (first?.sourceKey !== "PP:1" || second?.sourceKey !== "PP:2") {
              throw new Error("The first two Patriarchs and Prophets assignments could not be identified.");
            }

            return [
              {
                ...first,
                sourceBlock: 1,
                sourceKey: "PP:1+2",
                sourceEntry: "Gen 1; 2\\nCh 1—Why was Sin Permitted? PP 33-43\\nCh 2—The Creation PP 44-51",
                originalSourceEntry: `${first.sourceEntry}\\n\\n${second.sourceEntry}`,
                correctionApplied: true,
                heading: "",
                title: "Why was Sin Permitted? · The Creation",
                bibleReference: "Gen 1; 2",
                bibleQuery: "Gen 1; 2",
                bibleUrl: second.bibleUrl,
                bibleTasks: second.bibleTasks.map((task, index) => ({ ...task, legacyProgressIndex: index + 1 })),
                commentaryCitation: "Ch 1—Why was Sin Permitted? PP 33-43 · Ch 2—The Creation PP 44-51",
                commentaryPageStart: 33,
                commentaryPageEnd: 51,
                commentaryUrl: first.commentaryUrl,
                commentaryTasks: [
                  { ...first.commentaryTasks[0], legacyProgressIndex: 0 },
                  { ...second.commentaryTasks[0], legacyProgressIndex: 3 },
                ],
                reviewNote: null,
              },
              ...remaining,
            ];
          }

          const rawReadings = combineOpeningPpReadings(parsedReadings);
          const readings = rawReadings.map((reading, index) => ({
            day: index + 1,
            ...reading,
          }));'''
          if 'function combineOpeningPpReadings' not in importer:
              if old_importer not in importer:
                  raise SystemExit('Expected importer reading assembly block was not found')
              importer = importer.replace(old_importer, new_importer, 1)

          alias_anchor = '''  sourceHashes: Object.fromEntries(Object.entries(sourceTexts).map(([code, text]) => [code, createHash("sha256").update(text).digest("hex")])),
            books: Object.entries(bookMeta).map(([code, meta]) => ({'''
          alias_replacement = '''  sourceHashes: Object.fromEntries(Object.entries(sourceTexts).map(([code, text]) => [code, createHash("sha256").update(text).digest("hex")])),
            readingAliases: { "coa-002": "coa-001" },
            books: Object.entries(bookMeta).map(([code, meta]) => ({'''
          if 'readingAliases: { "coa-002": "coa-001" }' not in importer:
              if alias_anchor not in importer:
                  raise SystemExit('Expected importer payload anchor was not found')
              importer = importer.replace(alias_anchor, alias_replacement, 1)
          importer_path.write_text(importer)

          app_path = Path('bibleandconflictoftheages/app.js')
          app = app_path.read_text()

          old_controller = '''    getReadings: () => plan?.readings || [],
              escapeHTML,
              toast,
              setSync,
              showSignIn,
              rerender: render,
              showPrinciples: () => showView("principles", true),
              goToReadingById: (readingId) => {
                const index = plan.readings.findIndex((reading) => reading.id === readingId);'''
          new_controller = '''    getReadings: () => readingsWithAliases(),
              escapeHTML,
              toast,
              setSync,
              showSignIn,
              rerender: render,
              showPrinciples: () => showView("principles", true),
              goToReadingById: (readingId) => {
                const index = plan.readings.findIndex((reading) => reading.id === resolveReadingId(readingId));'''
          if 'getReadings: () => readingsWithAliases()' not in app:
              if old_controller not in app:
                  raise SystemExit('Expected Principles controller block was not found')
              app = app.replace(old_controller, new_controller, 1)

          helper_anchor = '''  function escapeHTML(value = "") {'''
          helpers = '''  function resolveReadingId(readingId) {
            return plan?.readingAliases?.[readingId] || readingId;
          }

          function readingIdsFor(readingId) {
            return [
              readingId,
              ...Object.entries(plan?.readingAliases || {})
                .filter(([, targetId]) => targetId === readingId)
                .map(([aliasId]) => aliasId),
            ];
          }

          function readingsWithAliases() {
            const readings = plan?.readings || [];
            const aliases = Object.entries(plan?.readingAliases || {}).map(([aliasId, targetId]) => {
              const target = readings.find((reading) => reading.id === targetId);
              return target ? { ...target, id: aliasId, aliasOf: targetId } : null;
            }).filter(Boolean);
            return [...readings, ...aliases];
          }

          function escapeHTML(value = "") {'''
          if 'function resolveReadingId(readingId)' not in app:
              if helper_anchor not in app:
                  raise SystemExit('Expected app helper anchor was not found')
              app = app.replace(helper_anchor, helpers, 1)

          old_progress_index = '''  function prepareChapterProgressIndex() {
            chapterTaskCount = 0;
            for (const reading of plan.readings) {
              for (const task of reading.bibleTasks ?? []) task.progressIndex = chapterTaskCount++;
              for (const task of reading.commentaryTasks ?? []) task.progressIndex = chapterTaskCount++;
            }
          }'''
          new_progress_index = '''  function prepareChapterProgressIndex() {
            const tasks = plan.readings.flatMap((reading) => [
              ...(reading.bibleTasks ?? []),
              ...(reading.commentaryTasks ?? []),
            ]);
            const reserved = new Set(tasks
              .map((task) => task.legacyProgressIndex)
              .filter((index) => Number.isInteger(index) && index >= 0));
            let nextIndex = 0;
            let maximumIndex = -1;

            for (const task of tasks) {
              if (Number.isInteger(task.legacyProgressIndex) && task.legacyProgressIndex >= 0) {
                task.progressIndex = task.legacyProgressIndex;
              } else {
                while (reserved.has(nextIndex)) nextIndex += 1;
                task.progressIndex = nextIndex;
                nextIndex += 1;
              }
              maximumIndex = Math.max(maximumIndex, task.progressIndex);
            }
            chapterTaskCount = maximumIndex + 1;
          }'''
          if 'const reserved = new Set(tasks' not in app:
              if old_progress_index not in app:
                  raise SystemExit('Expected chapter progress indexing function was not found')
              app = app.replace(old_progress_index, new_progress_index, 1)

          old_default = '''      const last = plan.readings.findIndex((reading) => reading.id === settings.last_reading_id);'''
          new_default = '''      const last = plan.readings.findIndex((reading) => reading.id === resolveReadingId(settings.last_reading_id));'''
          if old_default in app:
              app = app.replace(old_default, new_default, 1)

          old_principles = '''    const readingPrinciples = principles.filter((principle) => principle.reading_id === reading.id);'''
          new_principles = '''    const readingIds = new Set(readingIdsFor(reading.id));
              const readingPrinciples = principles.filter((principle) => readingIds.has(principle.reading_id));'''
          if old_principles in app:
              app = app.replace(old_principles, new_principles, 1)

          app_path.write_text(app)
          PY

          node --check scripts/import-conflict-reading-plans.mjs
          node --check bibleandconflictoftheages/app.js
          node scripts/validate-combined-first-reading.mjs

      - name: Commit the combined assignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibleandconflictoftheages/data/readings.json bibleandconflictoftheages/app.js scripts/import-conflict-reading-plans.mjs
          git commit -m "Combine the first two Conflict readings"
          git push origin "HEAD:${{ github.ref_name }}"
