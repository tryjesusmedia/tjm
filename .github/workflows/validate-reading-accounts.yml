name: Validate separate reading accounts
on:
  pull_request:
    paths: ['chronbible/**', 'bibleandconflictoftheages/**', 'scripts/test-reading-account-isolation.mjs', '.github/workflows/validate-reading-accounts.yml']
  push:
    branches: [main]
    paths: ['chronbible/**', 'bibleandconflictoftheages/**', 'scripts/test-reading-account-isolation.mjs', '.github/workflows/validate-reading-accounts.yml']
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-reading-account-isolation.mjs
      - run: node --check bibleandconflictoftheages/app.js
      - run: node --check chronbible/app.js
