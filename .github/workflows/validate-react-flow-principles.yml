name: Validate React Flow Principles

on:
  pull_request:
    paths:
      - "lib/principles-react-flow.mjs"
      - "lib/principles-react-flow-bridge.js"
      - "lib/principles-react-flow.css"
      - "lib/principles-drag.js"
      - "lib/principles-drag-guard.js"
      - "bibleandconflictoftheages/config.js"
      - "chronbible/config.js"
      - "scripts/validate-react-flow-principles.mjs"
      - ".github/workflows/validate-react-flow-principles.yml"
  push:
    branches: [main]
    paths:
      - "lib/principles-react-flow.mjs"
      - "lib/principles-react-flow-bridge.js"
      - "lib/principles-react-flow.css"
      - "lib/principles-drag.js"
      - "lib/principles-drag-guard.js"
      - "bibleandconflictoftheages/config.js"
      - "chronbible/config.js"
      - "scripts/validate-react-flow-principles.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate React Flow source and integration
        run: node scripts/validate-react-flow-principles.mjs
