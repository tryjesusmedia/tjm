name: Patch Folder Mind Map smoke-test launcher

on:
  push:
    branches:
      - feature/readable-intro-and-principles-text
    paths:
      - ".github/workflows/patch-folder-smoke-map-launcher.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Update smoke test for closed-by-default map
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/test-folders-mindmap-browser.mjs")
          source = path.read_text()
          old = '''  await page.reload({ waitUntil: "domcontentloaded" });
            await page.waitForSelector(".tjm-fm-window", { timeout: 45_000 });
            return { context, page };'''
          new = '''  await page.reload({ waitUntil: "domcontentloaded" });
            const launcher = page.locator(".tjm-fm-persistent-toggle");
            await launcher.waitFor({ state: "visible", timeout: 45_000 });
            if ((await launcher.textContent())?.trim() === "Open Principles Map") await launcher.click();
            await page.waitForSelector(".tjm-fm-window", { timeout: 45_000 });
            return { context, page };'''
          if old not in source:
              raise SystemExit("Expected openCleanPage block was not found")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Validate JavaScript syntax
        run: node --check scripts/test-folders-mindmap-browser.mjs

      - name: Commit the updated test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-folder-smoke-map-launcher.yml
          git add scripts/test-folders-mindmap-browser.mjs
          git commit -m "Open the closed Principles Map in its browser smoke test"
          git push origin "HEAD:${{ github.ref_name }}"
