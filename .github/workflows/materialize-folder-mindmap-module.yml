name: Materialize Folder Mind Map module

on:
  push:
    branches:
      - feature/folder-mind-map
    paths:
      - "scripts/principles-folders-flow.mjs.gz.b64"
      - ".github/workflows/materialize-folder-mindmap-module.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Rebuild the module from the checked-in payload
        run: |
          base64 --decode scripts/principles-folders-flow.mjs.gz.b64 | gzip --decompress > lib/principles-folders-flow.mjs
          node --check lib/principles-folders-flow.mjs
      - name: Commit the materialized module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/principles-folders-flow.mjs
          if git diff --cached --quiet; then
            echo "Module is already current."
          else
            git commit -m "Materialize Folder Mind Map module"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
