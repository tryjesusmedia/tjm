<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../assets/readability.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xyflow/react@12.11.3/dist/style.css">
  <link rel="stylesheet" href="../lib/principles-folders-flow.css">
  <link rel="stylesheet" href="../lib/principles-text-size.css">
  <link rel="stylesheet" href="../lib/reading-plan-copy-mobile-map-fix.css">
  <style>
    :root { --serif: Georgia, serif; }
    body { min-height: 2200px; margin: 0; padding: 24px; font-family: Arial, sans-serif; background: #f3e8d0; }
    #view-root { max-width: 1180px; margin: auto; }
    .journey-nav { position: sticky; top: 0; }
    .toast-region { position: fixed; left: 12px; bottom: 12px; }
  </style>
</head>
<body>
  <div id="copy-removal-fixture" hidden>
    <small>Use any available whole number. Every principle number must be unique.</small>
    <small>Give this principle a short, memorable name. Leave the automatic name unchanged.</small>
    <p>Write one principle at a time. Choose any unused number to organize your discoveries throughout the journey.</p>
  </div>
  <nav class="journey-nav">
    <button class="active" data-view="readings">Readings</button>
    <button data-view="journey">Journey</button>
    <button data-view="progress">Progress</button>
  </nav>
  <span id="sync-status"></span>
  <div id="toast-region" class="toast-region"></div>
  <div id="view-root"><section class="principles-view"><h2>Legacy fallback</h2></section></div>

  <script>
    const params = new URLSearchParams(location.search);
    const planId = params.has('chron') ? 'chronological-bible-order-v3' : 'bible-conflict-ages-v1';
    window[params.has('chron') ? 'TJM_CHRONBIBLE_CONFIG' : 'TJM_CONFLICT_CONFIG'] = {
      planId,
      supabaseUrl: "https://example.invalid",
      supabasePublishableKey: "test",
    };

    const rowsKey = `smoke-rows:${planId}`;
    let rows = JSON.parse(localStorage.getItem(rowsKey) || 'null') || [
      { id: "p1", reading_id: "r1", principle_number: 12, body: "Grace changes how we see both God and one another.", cross_reference_numbers: [], group_id: "g1", group_title: null },
      { id: "p2", reading_id: "r2", principle_number: 4, body: "Trust grows when truth is practiced in ordinary decisions.", cross_reference_numbers: [12], group_id: "g1", group_title: null },
      { id: "p3", reading_id: "r3", principle_number: 27, body: "Prayer makes room to listen before reacting to pressure. A calm pause helps us notice what fear would otherwise hide. Listening first gives wisdom time to shape a faithful response. Patient attention makes space for truth, compassion, and courage. When pressure rises, prayer reminds us that haste does not have to lead. We can slow down, listen well, and choose words that bring peace. This practice changes conflict from a contest into an opportunity to understand. It also helps us remember that every person carries needs we may not yet see.", cross_reference_numbers: [], group_id: null, group_title: null },
      { id: "p4", reading_id: "r4", principle_number: 31, body: "Patience creates room for wisdom to become visible.", cross_reference_numbers: [], group_id: null, group_title: null },
    ];
    let deleted = [{ id: 'deleted-90', principle_number: 90, deleted_at: '2026-09-01T00:00:00Z' }];
    let cloudLayout = {};
    window.__rpcCalls = [];

    const rpc = async (name, args) => {
      window.__rpcCalls.push({ name, args });
      if (name === 'get_principle_map_layout') return { data: cloudLayout, error: null };
      if (name === 'save_principle_map_layout') {
        cloudLayout = args.p_layout;
        return { data: cloudLayout, error: null };
      }
      if (name === 'set_conflict_principle_name') {
        if (params.has('namefail')) return { data: null, error: { code: 'PGRST202', message: 'Naming migration not installed' } };
        rows = rows.map((row) => row.id === args.p_principle_id ? { ...row, principle_name: args.p_name } : row);
      } else
      if (name === "update_conflict_principle") {
        rows = rows.map((row) => row.id === args.p_principle_id ? { ...row, principle_number: args.p_principle_number, body: args.p_body, cross_reference_numbers: args.p_cross_reference_numbers } : row);
      } else if (name === "rename_conflict_principle_group") {
        rows = rows.map((row) => row.group_id === args.p_group_id ? { ...row, group_title: args.p_title } : row);
      } else if (name === "dissolve_conflict_principle_group") {
        rows = rows.map((row) => row.group_id === args.p_group_id ? { ...row, group_id: null, group_title: null } : row);
      } else if (name === "soft_delete_conflict_principles") {
        const ids = new Set(args.p_principle_ids);
        deleted = [...deleted, ...rows.filter((row) => ids.has(row.id)).map((row) => ({ ...row, deleted_at: new Date().toISOString() }))];
        rows = rows.filter((row) => !ids.has(row.id));
      } else if (name === "move_conflict_principles") {
        const ids = new Set(args.p_principle_ids);
        if (args.p_mode === "standalone") {
          rows = rows.map((row) => ids.has(row.id) ? { ...row, group_id: null, group_title: null } : row);
        } else if (args.p_mode === "new") {
          const folderId = `f${Date.now()}`;
          rows = rows.map((row) => ids.has(row.id) ? { ...row, group_id: folderId, group_title: args.p_group_title || null } : row);
        } else {
          const target = rows.find((row) => row.id === args.p_target_principle_id);
          rows = rows.map((row) => ids.has(row.id) ? { ...row, group_id: target.group_id, group_title: target.group_title } : row);
        }
      } else if (name === "create_conflict_principle") {
        if ([...rows, ...deleted].some((row) => row.principle_number === args.p_principle_number)) return { data: null, error: { message: 'Number already in use' } };
        const created = { id: crypto.randomUUID(), reading_id: args.p_reading_id, principle_number: args.p_principle_number, body: args.p_body, cross_reference_numbers: args.p_cross_reference_numbers, group_id: null, group_title: null };
        rows = [...rows, created];
        localStorage.setItem(rowsKey, JSON.stringify(rows));
        return { data: created, error: null };
      }
      localStorage.setItem(rowsKey, JSON.stringify(rows));
      return { data: rows, error: null };
    };

    window.TJMReactFlowBridge = {
      version: 1,
      controller: {},
      options: {
        planId,
        getSession: () => ({ user: { id: "smoke-user" } }),
        getPrinciples: () => rows,
        setPrinciples: (next) => { rows = next; },
        getDeletedPrinciples: () => deleted,
        setDeletedPrinciples: (next) => { deleted = next; },
        getReadings: () => [{ id: "r1", title: "Genesis 1" }, { id: "r2", title: "Genesis 2" }, { id: "r3", title: "Genesis 3" }, { id: "r4", title: "Genesis 4" }],
        readingLabel: (reading) => reading.title,
        getDb: () => ({ rpc }),
        setSync: (label) => { document.getElementById("sync-status").textContent = label; },
        toast: (message) => { document.getElementById("toast-region").textContent = message; },
        showSignIn: () => { window.__showedSignIn = true; },
        goToReadingById: (id) => { window.__wentToReading = id; },
      },
    };
    document.querySelector('.journey-nav').addEventListener('click', (event) => {
      const button = event.target.closest('[data-view]');
      if (!button) return;
      document.querySelectorAll('[data-view]').forEach((item) => item.classList.toggle('active', item === button));
      document.querySelector('#view-root').innerHTML = `<section data-current-view="${button.dataset.view}">${button.textContent}</section>`;
    });
    if (params.has('autoopen')) {
      window.addEventListener('tjm-principles-bridge-ready', () => {
        setTimeout(() => window.dispatchEvent(new CustomEvent('tjm-open-principles-map')), 50);
      }, { once: true });
      setTimeout(() => window.dispatchEvent(new CustomEvent('tjm-open-principles-map')), 900);
    }
  </script>
  <script type="module" src="../lib/principles-folders-flow.mjs"></script>
  <script defer src="../lib/principles-text-size.js"></script>
  <script defer src="../lib/reading-plan-copy-mobile-map-fix.js"></script>
</body>
</html>
